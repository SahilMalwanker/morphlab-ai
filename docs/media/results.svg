<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Measured results</title><desc id="d">Walking controller: 40 of 40 commands within tolerance with the learned calibration versus 2 of 40 without, mean position error 1.3 cm versus 17.7 cm. Control lab: steady-state error 2.45 degrees with PD alone versus 0.00 with gravity compensation, overshoot 27.0 versus 12.4 percent. Skill evaluations of 20 randomized trials each.</desc>
<defs><style>
.h{font:700 18px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#f2f5f3} .s{font:400 13px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#9caaa6} .cap{font:600 12px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#9caaa6;letter-spacing:1.5px}
.v{font:700 15px ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#f2f5f3} .l{font:400 13px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#c0cbc8}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 9s cubic-bezier(.2,.8,.2,1) infinite}
.fade{animation:fade 9s infinite}
@keyframes grow{0%{transform:scaleX(0)}14%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes fade{0%,10%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style></defs>
<rect width="1200" height="520" rx="16" fill="#111415"/>
<rect x="30" y="30" width="370" height="460" rx="12" fill="#1b2021" stroke="#3a4548"/>
<text class="cap" x="52" y="60">LEARNED WALKING  ·  QUADRUPED</text><text class="h" x="52" y="86">40 randomized walking commands</text>
<text class="l" x="52" y="132">gait generator, no calibration</text>
<rect x="52" y="140" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0s" x="52" y="140" width="18" height="18" rx="9" fill="#ff9b9b"/>
<text class="v fade" style="animation-delay:0s" x="378" y="132" text-anchor="end">2 / 40</text>
<text class="l" x="52" y="192">learned calibration + feedback policy</text>
<rect x="52" y="200" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.25s" x="52" y="200" width="326" height="18" rx="9" fill="#92ceaa"/>
<text class="v fade" style="animation-delay:0.25s" x="378" y="192" text-anchor="end">40 / 40</text>
<text class="s" x="52" y="262">mean position error</text>
<text class="l" x="52" y="292">without calibration</text>
<rect x="52" y="300" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.5s" x="52" y="300" width="326" height="18" rx="9" fill="#ff9b9b"/>
<text class="v fade" style="animation-delay:0.5s" x="378" y="292" text-anchor="end">17.7 cm</text>
<text class="l" x="52" y="352">learned controller</text>
<rect x="52" y="360" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.75s" x="52" y="360" width="23.94" height="18" rx="9" fill="#92ceaa"/>
<text class="v fade" style="animation-delay:0.75s" x="378" y="352" text-anchor="end">1.3 cm</text>
<text class="s" x="52" y="430">2722 simulated runs on 4 browser workers, 264 s.</text>
<text class="s" x="52" y="450">Commanded by the AI: 0.400 m asked, 0.414 m measured.</text>
<rect x="415" y="30" width="370" height="460" rx="12" fill="#1b2021" stroke="#3a4548"/>
<text class="cap" x="437" y="60">CONTROL LAB  ·  20 DEG STEP</text><text class="h" x="437" y="86">PD alone vs PD + gravity compensation</text>
<text class="l" x="437" y="132">steady-state error, PD alone</text>
<rect x="437" y="140" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.2s" x="437" y="140" width="326" height="18" rx="9" fill="#ff9b9b"/>
<text class="v fade" style="animation-delay:0.2s" x="763" y="132" text-anchor="end">2.45 deg</text>
<text class="l" x="437" y="192">steady-state error, with compensation</text>
<rect x="437" y="200" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.45s" x="437" y="200" width="18" height="18" rx="9" fill="#92ceaa"/>
<text class="v fade" style="animation-delay:0.45s" x="763" y="192" text-anchor="end">0.00 deg</text>
<text class="l" x="437" y="272">overshoot, PD alone</text>
<rect x="437" y="280" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.7s" x="437" y="280" width="293.4" height="18" rx="9" fill="#f1ca89"/>
<text class="v fade" style="animation-delay:0.7s" x="763" y="272" text-anchor="end">27.0 %</text>
<text class="l" x="437" y="332">overshoot, with compensation</text>
<rect x="437" y="340" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.95s" x="437" y="340" width="134.75" height="18" rx="9" fill="#92ceaa"/>
<text class="v fade" style="animation-delay:0.95s" x="763" y="332" text-anchor="end">12.4 %</text>
<text class="s" x="437" y="410">Settling (2 %): never vs 0.308 s.</text>
<text class="s" x="437" y="430">Hold-a-pose challenge: A failed, B passed.</text>
<text class="s" x="437" y="450">Recorded MuJoCo runs, encoder readings.</text>
<rect x="800" y="30" width="370" height="460" rx="12" fill="#1b2021" stroke="#3a4548"/>
<text class="cap" x="822" y="60">SKILL EVALUATIONS</text><text class="h" x="822" y="86">20 randomized trials each</text>
<text class="l" x="822" y="132">foot lift, state machine</text>
<rect x="822" y="140" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.3s" x="822" y="140" width="326" height="18" rx="9" fill="#9bd6c3"/>
<text class="v fade" style="animation-delay:0.3s" x="1148" y="132" text-anchor="end">20 / 20</text>
<text class="l" x="822" y="194">foot lift, tuned parameters</text>
<rect x="822" y="202" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.5s" x="822" y="202" width="326" height="18" rx="9" fill="#9bd6c3"/>
<text class="v fade" style="animation-delay:0.5s" x="1148" y="194" text-anchor="end">20 / 20</text>
<text class="l" x="822" y="256">foot lift, imitation (64x64 MLP)</text>
<rect x="822" y="264" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.7s" x="822" y="264" width="326" height="18" rx="9" fill="#9bd6c3"/>
<text class="v fade" style="animation-delay:0.7s" x="1148" y="256" text-anchor="end">20 / 20</text>
<text class="l" x="822" y="318">crouch, taught keyframes</text>
<rect x="822" y="326" width="326" height="18" rx="9" fill="#2f383b"/>
<rect class="bar" style="animation-delay:0.9000000000000001s" x="822" y="326" width="326" height="18" rx="9" fill="#9bd6c3"/>
<text class="v fade" style="animation-delay:0.9000000000000001s" x="1148" y="318" text-anchor="end">20 / 20</text>
<text class="s" x="822" y="400">Friction 0.6-1.2, mass within 12.5 %,</text>
<text class="s" x="822" y="420">joint offsets up to 0.02 rad. Evolution</text>
<text class="s" x="822" y="440">strategies found no improvement this run</text>
<text class="s" x="822" y="460">(held-out reward 2.750 to 2.750).</text>
</svg>