<text class="cap" x="940" y="58">OPTIONAL  ·  LOCAL</text>
<rect x="940" y="196" width="210" height="110" rx="10" fill="#1b2021" stroke="#e5c58b" stroke-width="1.5" /><text class="h" x="1045.0" y="248.0" text-anchor="middle">AI proxy</text><text class="s" x="1045.0" y="268.0" text-anchor="middle">Node.js or PowerShell</text>
<text class="m" x="1045" y="290" text-anchor="middle">only reader of .env</text>
<rect x="940" y="400" width="210" height="90" rx="10" fill="#242b2d" stroke="#3a4548" stroke-width="1.5" /><text class="h" x="1045.0" y="442.0" text-anchor="middle">Language model</text><text class="s" x="1045.0" y="462.0" text-anchor="middle">chat completions</text>
<path class="flow2" d="M858 234 C 900 234, 900 250, 940 250"/>
