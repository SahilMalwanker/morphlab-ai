<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">The AI closed loop</title><desc id="d">A command goes to local rules, then to a language model that selects one tool. The validator checks it, the task manager runs it in the simulation, and the measured result goes back to the model and into the reply. Stop always works locally.</desc>
<defs><style>
.h{font:700 19px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#f2f5f3} .s{font:400 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#9caaa6} .m{font:400 13px ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#c0cbc8} .cap{font:600 13px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#9caaa6;letter-spacing:1.5px}
.flow{fill:none;stroke:#637275;stroke-width:2;stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637275"/></marker>
</defs>
<rect width="1200" height="600" rx="16" fill="#111415"/>
<text class="cap" x="40" y="44">ONE AI TURN</text>
<text class="s" x="40" y="66">The model never produces joint targets or torques. It picks a tool; everything after that is checked and measured.</text>
<path class="flow" d="M110 120 L370 120 L630 120 L890 120 L1090 120 L1090 300 L1090 480 L890 480 L630 480 L370 480 L110 480 L110 120" marker-mid="url(#ar)"/>
<path d="M370 160 C 370 300, 900 300, 1030 300" fill="none" stroke="#e5c58b" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 7" marker-end="url(#ar)"/>
<text class="m" x="645" y="336" fill="#e5c58b" style="fill:#e5c58b">recognized locally: runs without the model</text>
<path d="M630 440 L630 160" fill="none" stroke="#9bd6c3" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#ar)"/>
<text class="m" x="642" y="405">result back to the model</text>
<rect x="6.0" y="79.0" width="208" height="82" rx="14" fill="#9bd6c3" opacity="0" filter="url(#blur)"><animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0;0.01;0.09;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="10.0" y="83.0" width="200" height="74" rx="12" fill="#1b2021" stroke="#3a4548" stroke-width="1.5"/><text class="h" x="110" y="116" text-anchor="middle">You</text><text class="s" x="110" y="140" text-anchor="middle">text or voice command</text>
<rect x="266.0" y="79.0" width="208" height="82" rx="14" fill="#9bd6c3" opacity="0" filter="url(#blur)"><animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.08;0.11;0.19;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="270.0" y="83.0" width="200" height="74" rx="12" fill="#1b2021" stroke="#3a4548" stroke-width="1.5"/><text class="h" x="370" y="116" text-anchor="middle">Local rules</text><text class="s" x="370" y="140" text-anchor="middle">parser, no AI needed</text>
<rect x="526.0" y="79.0" width="208" height="82" rx="14" fill="#9bd6c3" opacity="0" filter="url(#blur)"><animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.17;0.2;0.28;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="530.0" y="83.0" width="200" height="74" rx="12" fill="#1b2021" stroke="#9bd6c3" stroke-width="1.5"/><text class="h" x="630" y="116" text-anchor="middle">Language model</text><text class="s" x="630" y="140" text-anchor="middle">selects one tool</text>
<rect x="786.0" y="79.0" width="208" height="82" rx="14" fill="#9bd6c3" opacity="0" filter="url(#blur)"><animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.27;0.3;0.38;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="790.0" y="83.0" width="200" height="74" rx="12" fill="#1b2021" stroke="#9bd6c3" stroke-width="1.5"/><text class="h" x="890" y="116" text-anchor="middle">Validator</text><text class="s" x="890" y="140" text-anchor="middle">schema, bounds, robot</text>
<rect x="986.0" y="259.0" width="208" height="82" rx="14" fill="#9bd6c3" opacity="0" filter="url(#blur)"><animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.41;0.44;0.52;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="990.0" y="263.0" width="200" height="74" rx="12" fill="#1b2021" stroke="#3a4548" stroke-width="1.5"/><text class="h" x="1090" y="296" text-anchor="middle">Task manager</text><text class="s" x="1090" y="320" text-anchor="middle">one task, safe stop</text>
<rect x="786.0" y="439.0" width="208" height="82" rx="14" fill="#9bd6c3" opacity="0" filter="url(#blur)"><animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.55;0.58;0.66;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="790.0" y="443.0" width="200" height="74" rx="12" fill="#1b2021" stroke="#3a4548" stroke-width="1.5"/><text class="h" x="890" y="476" text-anchor="middle">Simulation</text><text class="s" x="890" y="500" text-anchor="middle">MuJoCo + 500 Hz PD</text>
<rect x="526.0" y="439.0" width="208" height="82" rx="14" fill="#9bd6c3" opacity="0" filter="url(#blur)"><animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.65;0.68;0.76;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="530.0" y="443.0" width="200" height="74" rx="12" fill="#1b2021" stroke="#9bd6c3" stroke-width="1.5"/><text class="h" x="630" y="476" text-anchor="middle">Measured result</text><text class="s" x="630" y="500" text-anchor="middle">status, measurements</text>
<rect x="266.0" y="439.0" width="208" height="82" rx="14" fill="#9bd6c3" opacity="0" filter="url(#blur)"><animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.75;0.78;0.86;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="270.0" y="443.0" width="200" height="74" rx="12" fill="#1b2021" stroke="#3a4548" stroke-width="1.5"/><text class="h" x="370" y="476" text-anchor="middle">Reply</text><text class="s" x="370" y="500" text-anchor="middle">status from measurements</text>
<rect x="6.0" y="439.0" width="208" height="82" rx="14" fill="#9bd6c3" opacity="0" filter="url(#blur)"><animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.85;0.88;0.96;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="10.0" y="443.0" width="200" height="74" rx="12" fill="#1b2021" stroke="#3a4548" stroke-width="1.5"/><text class="h" x="110" y="476" text-anchor="middle">Memory</text><text class="s" x="110" y="500" text-anchor="middle">evidence notes</text>
<circle r="7" fill="#e5c58b"><animateMotion dur="9.0s" repeatCount="indefinite" path="M110 120 L370 120 L630 120 L890 120 L1090 120 L1090 300 L1090 480 L890 480 L630 480 L370 480 L110 480 L110 120"/></circle>
<circle r="16" fill="#e5c58b" opacity="0.25"><animateMotion dur="9.0s" repeatCount="indefinite" path="M110 120 L370 120 L630 120 L890 120 L1090 120 L1090 300 L1090 480 L890 480 L630 480 L370 480 L110 480 L110 120"/></circle>
<rect x="300" y="540" width="660" height="40" rx="8" fill="#242b2d" stroke="#3a4548"/>
<text class="m" x="630" y="565" text-anchor="middle">{ taskId, status, reason, measurements, fallback }  is all a tool ever returns</text>
<rect x="990" y="538" width="190" height="44" rx="22" fill="#382728" stroke="#ff9b9b"/><text x="1085" y="558" text-anchor="middle" style="font:700 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#ff9b9b">Stop</text><text x="1085" y="574" text-anchor="middle" style="font:400 12px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#c0cbc8">local, works without AI</text>
</svg>